<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Training</title>

<!-- iOS Home-Bildschirm / PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="apple-touch-icon" href="App Icon/icon-180.png">
<link rel="icon" href="App Icon/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.json">
<!-- iOS-Launch-Screen (iPhone 12 mini): iOS ignoriert manifest.json background_color hierfuer,
     das ist der einzige von Apple unterstuetzte Weg. Zeigt das leere Pergament (identisch zum
     ersten Frame des Splash-Screens) statt weissem Blitz. iPhone 12 mini rendert CSS-Media-Queries
     unter der "Punkte-Klasse" des iPhone 11 Pro (375x812pt @3x = 1125x2436px), NICHT unter der
     physischen Panel-Aufloesung (1080x2340) - Apples eigene Kompatibilitaets-Eigenheit. -->
<link rel="apple-touch-startup-image" href="Splash screen/apple-splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
<meta name="theme-color" content="#cbb897">

<style>
  :root {
    color-scheme: light;
    --bg-image: url('Splash screen/bg-full.png');
    --header-bg: #cbb897;
    --card: #e7dcc4;
    --accent: #4fd1a5;
    --text: #34373a;
    --muted: #6b6f73;
    --done: #dbe8d6;
    --section-bg: #95ddbe;
    --line: rgba(52,55,58,0.28);
    --ring-strength: #d99a4e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background-color: #c9b291; /* Fallback, das eigentliche Bild liefert #page-bg */
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* body bekommt einen eigenen Stacking-Context (position:relative), damit #page-bg
     mit negativem z-index nicht gegen den Wurzel-/Canvas-Stacking-Context arbeitet -
     dort kommt es auf iOS Safari vereinzelt vor, dass ein fixed-Element mit negativem
     z-index gar nicht gerendert wird, gerade wenn andere fixed-Elemente (unser Splash)
     zwischenzeitlich ein-/ausgeblendet werden. Innerhalb eines eigenen, lokalen
     Stacking-Contexts arbeitet dieselbe negative-z-index-Technik zuverlässig. */
  body {
    position: relative;
    z-index: 0;
  }
  /* Eigenes fixiertes Hintergrund-Element statt background-attachment:fixed auf body:
     iOS Safari setzt beim Rubber-Band-Overscroll einen fixed *background* nicht korrekt
     fort (zeigt dort Weiß). Ein echtes position:fixed-Element wird dagegen zuverlässig
     auch im Überzieh-Bereich dargestellt. */
  #page-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    -webkit-transform: translateZ(0); /* erzwingt eigene Compositing-Ebene */
    background: var(--bg-image) center / cover no-repeat;
  }
  body {
    padding: 0 16px calc(env(safe-area-inset-bottom) + 24px) 16px;
    padding-top: var(--header-h, 168px);
    max-width: 560px;
    margin: 0 auto;
  }
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 500;
    background: var(--header-bg);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 8px 16px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    box-shadow: 0 6px 10px -4px rgba(30, 24, 14, 0.35);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    max-width: 560px;
    margin: 0 auto;
  }
  .logo-slot {
    flex: 0 0 46px;
    width: 46px;
    height: 46px;
    border-radius: 11px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(30, 24, 14, 0.4);
  }
  .logo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .header-text {
    text-align: left;
  }
  header h1 {
    font-size: 1.1rem;
    margin: 0 0 2px 0;
    color: var(--text);
  }
  header .date {
    color: var(--muted);
    font-size: 0.78rem;
  }

  /* ---------- Splash Screen ---------- */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #c9b291 var(--bg-image) center / cover no-repeat;
  }
  #splash-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  #splash-svg .draw-line {
    fill: none;
    stroke: #4a4e52; /* anthrazit statt Tinten-Braun */
    stroke-width: 0.8;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  #splash-person {
    opacity: 0;
  }
  #icon-group {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .day-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 14px;
    border-radius: 999px;
    background: var(--accent);
    color: #06231a;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .progress {
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  section.section-box {
    margin-top: 22px;
    background: var(--section-bg);
    border-radius: 16px;
    padding: 14px 14px 6px 14px;
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 10px 4px;
  }
  .section-header h2 {
    flex: 1;
    font-size: 1rem;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    margin: 0;
  }
  .collapse-btn {
    flex: 0 0 auto;
    background: none;
    border: none;
    padding: 4px;
    margin: 0 4px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    cursor: pointer;
  }
  .collapse-btn .chevron {
    transition: transform 180ms ease;
  }
  .section-box.collapsed .collapse-btn .chevron {
    transform: rotate(-90deg);
  }
  .section-box.collapsed ul.exercise-list {
    display: none;
  }
  ul.exercise-list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: transparent;
    border-radius: 14px;
    overflow: hidden;
  }
  li.exercise {
    display: block;
    padding: 14px 14px;
    border-bottom: 1px solid rgba(52,55,58,0.1);
    background: var(--done);
  }
  li.exercise:last-child { border-bottom: none; }
  .exercise-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .checkbox {
    flex: 0 0 26px;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: transparent;
  }
  li.exercise.done .checkbox,
  .checkbox.checked {
    background: var(--accent);
    border-color: var(--accent);
    color: #06231a;
  }
  .exercise-info { flex: 1; min-width: 0; }
  .name-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .exercise-name {
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    color: var(--text);
  }
  .link-icon {
    flex: 0 0 auto;
    display: inline-flex;
    color: var(--muted);
  }
  .exercise-detail {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .timer-toggle-btn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 1px;
    background: none;
    border: none;
    padding: 4px;
    margin: 0;
    color: var(--muted);
    cursor: pointer;
  }
  .timer-toggle-btn .chevron {
    transition: transform 180ms ease;
    transform: rotate(-90deg);
  }
  .timer-toggle-btn.expanded .chevron {
    transform: rotate(0deg);
  }
  .timer-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(52,55,58,0.15);
    container-type: inline-size;
  }
  li.exercise.timer-open .timer-panel {
    display: block;
  }
  .timer-display {
    font-size: clamp(2.5rem, 22cqi, 7.5rem);
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    color: var(--text);
    margin-bottom: 14px;
    border-radius: 14px;
    background: transparent;
    transition: background-color 200ms ease;
  }
  .timer-display.target-reached {
    background: #4fd1a5;
  }
  .timer-buttons {
    display: flex;
    gap: 10px;
  }
  .timer-buttons button {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  .timer-startstop {
    background: var(--accent);
    color: #06231a;
  }
  .timer-startstop.running {
    background: #d64f4f;
    color: #fff;
  }
  .timer-buttons button.timer-reset {
    background: none;
    border: 1.5px solid rgba(52,55,58,0.45);
    color: var(--muted);
  }
  .sets-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(52,55,58,0.15);
  }
  li.exercise.sets-open .sets-panel {
    display: block;
  }
  .sides-list, .sets-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .side-row, .set-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: rgba(52,55,58,0.06);
    border-radius: 10px;
  }
  .side-label, .set-label {
    flex: 1;
    font-size: 0.9rem;
    color: var(--text);
  }
  .side-time {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .trash-btn {
    flex: 0 0 auto;
    background: none;
    border: none;
    padding: 4px;
    margin: 0;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .set-stepper {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-btn {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1.5px solid rgba(52,55,58,0.35);
    background: none;
    color: var(--text);
    font-size: 1.1rem;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .set-count {
    min-width: 24px;
    text-align: center;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .sets-add-btn {
    margin-top: 4px;
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1.5px dashed rgba(52,55,58,0.35);
    background: none;
    color: var(--muted);
    font-size: 0.9rem;
    cursor: pointer;
  }
  footer {
    margin-top: 30px;
    text-align: center;
  }
  button.reset {
    background: none;
    border: 1px solid rgba(52,55,58,0.25);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.8rem;
  }
  .sync-link {
    display: block;
    margin: 10px auto 0 auto;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.78rem;
    text-decoration: underline;
    padding: 6px;
    cursor: pointer;
  }
  .sync-panel {
    display: none;
    max-width: 400px;
    margin: 10px auto 0 auto;
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    text-align: left;
  }
  .sync-panel.open {
    display: block;
  }
  .sync-status {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .sync-token-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid rgba(52,55,58,0.3);
    background: #fff;
    color: var(--text);
    font-size: 0.9rem;
    box-sizing: border-box;
  }
  .sync-panel-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .sync-panel-buttons button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  .sync-save-btn {
    background: var(--accent);
    color: #06231a;
  }
  .sync-remove-btn {
    background: none;
    border: 1.5px solid rgba(52,55,58,0.35);
    color: var(--muted);
  }
  .stats-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 22px;
    background: var(--section-bg);
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text);
    cursor: pointer;
  }

  /* ---------- Statistik / Kalenderansicht ---------- */
  .view-overlay {
    display: none;
    flex-direction: column;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: #c9b291 var(--bg-image) center / cover no-repeat;
  }
  .view-overlay.open {
    display: flex;
  }
  .view-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--header-bg);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 12px 16px;
    border-bottom: 1px solid var(--line);
    box-shadow: 0 6px 10px -4px rgba(30, 24, 14, 0.35);
  }
  .view-header h2 {
    margin: 0;
    font-size: 1.05rem;
    color: var(--text);
  }
  .view-close-btn {
    background: none;
    border: none;
    padding: 6px;
    margin: 0;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .view-body {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 24px) 16px;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
  }
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .month-nav button {
    background: none;
    border: none;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--text);
    padding: 6px 16px;
    cursor: pointer;
  }
  .month-label {
    font-weight: 700;
    font-size: 1rem;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }
  .weekday-label {
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .day-cell {
    background: none;
    border: none;
    padding: 4px 0 6px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    border-radius: 12px;
    cursor: pointer;
  }
  .day-cell:disabled {
    cursor: default;
  }
  .day-cell.today {
    background: rgba(79, 209, 165, 0.18);
  }
  .day-cell-blank {
    visibility: hidden;
  }
  .day-cell-num {
    font-size: 0.76rem;
    color: var(--text);
    font-weight: 600;
  }
  .day-cell-num.muted {
    color: var(--muted);
    font-weight: 400;
  }
  .stats-loading {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 30px 0;
  }
  .day-detail-rings {
    display: flex;
    justify-content: center;
    margin: 6px 0 18px 0;
  }
  .day-detail-summary {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    margin-bottom: 22px;
    font-size: 0.9rem;
    color: var(--text);
  }
  .day-detail-summary div {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .day-detail-summary .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .day-detail-section {
    margin-bottom: 18px;
  }
  .day-detail-section h3 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 8px 4px;
  }
  .day-detail-list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--done);
    border-radius: 14px;
    overflow: hidden;
  }
  .day-detail-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(52,55,58,0.1);
    flex-wrap: wrap;
  }
  .day-detail-item:last-child { border-bottom: none; }
  .day-detail-check {
    flex: 0 0 20px;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    color: transparent;
  }
  .day-detail-item.done .day-detail-check {
    background: var(--accent);
    border-color: var(--accent);
    color: #06231a;
  }
  .day-detail-name {
    flex: 1;
    font-size: 0.92rem;
    color: var(--text);
  }
  .day-detail-extra {
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div id="page-bg" aria-hidden="true"></div>

<div id="splash" aria-hidden="true">
  <!-- Pergament-Hintergrund kommt jetzt als CSS-background auf #splash (siehe <style>),
       damit er stets randlos abdeckt, unabhängig vom viewBox-"meet" der Figur darunter. -->
  <svg id="splash-svg" viewBox="0 0 568 1020" preserveAspectRatio="xMidYMid meet">
    <!-- Person, Quadrat, Kreis - das wandert später gemeinsam zum Logo -->
    <g id="icon-group">
      <image id="splash-person" href="Splash screen/person-icon-transparent.png" x="20" y="246" width="530" height="530" />
      <rect id="splash-square" class="draw-line" x="80" y="350" width="408" height="408" />
      <circle id="splash-circle" class="draw-line" cx="285.5" cy="511.5" r="244.9" />
    </g>
  </svg>
</div>

<header>
  <div class="header-top">
    <div class="logo-slot" id="logo-slot"></div>
    <div class="header-text">
      <h1>Mein Training</h1>
      <div class="date" id="today-date"></div>
    </div>
  </div>
  <div class="day-badge" id="day-badge"></div>
  <div class="progress" id="progress-text"></div>
</header>

<section class="section-box" id="warmup-section">
  <div class="section-header">
    <div class="checkbox section-checkbox" data-section="warmup" role="button" aria-label="Alle Warm-up-Übungen abhaken">✓</div>
    <h2>Warm-up</h2>
    <button class="collapse-btn" type="button" data-target="warmup-section" aria-label="Bereich auf-/zuklappen">
      <svg class="chevron" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 7l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <ul class="exercise-list" id="warmup-list"></ul>
</section>

<section class="section-box" id="day-section">
  <div class="section-header">
    <div class="checkbox section-checkbox" data-section="day" role="button" aria-label="Alle heutigen Übungen abhaken">✓</div>
    <h2 id="day-section-title">Heutiges Training</h2>
    <button class="collapse-btn" type="button" data-target="day-section" aria-label="Bereich auf-/zuklappen">
      <svg class="chevron" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 7l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <ul class="exercise-list" id="day-list"></ul>
</section>

<section class="section-box" id="optional-section">
  <div class="section-header">
    <div class="checkbox section-checkbox" data-section="optional" role="button" aria-label="Alle optionalen Übungen abhaken">✓</div>
    <h2>Optional</h2>
    <button class="collapse-btn" type="button" data-target="optional-section" aria-label="Bereich auf-/zuklappen">
      <svg class="chevron" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 7l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <ul class="exercise-list" id="optional-list"></ul>
</section>

<button class="stats-btn" id="stats-open-btn" type="button">Statistik</button>

<footer>
  <button class="reset" id="reset-btn">Heutige Häkchen zurücksetzen</button>

<script>

// andere Ursache. Automatische Wiederherstellung deaktivieren und bei jedem

}

// ---------- Daten ----------
const warmup = [

  { id: 'w4', name: "Morning Stretch", detail: "30 Sek" },

  { id: 'w6', name: "World's Greatest Stretch", detail: "5 Wdh./Seite", link: "https://dieringe.com/de/exercises/worlds-greatest-stretch" },

const days = {

      { id: 'a3', name: "Liegestütze", detail: "3 Sätze", link: "https://www.fitkurs.de/uebungen/liegestuetze/", sets: true, defaultReps: 15 },
      { id: 'a4', name: "Pallof Press", detail: "2 Sätze x 10-12/Seite", link: "https://www.fitbook.de/fitness/pallof-press-effektiver-als-plank", sets: true, defaultReps: 10 },
    ]
  },
  B: {

    exercises: [
      { id: 'b2', name: "Klimmzüge", detail: "3 Sätze", link: "https://www.marathonfitness.de/klimmzuege-lernen/", sets: true, defaultReps: 6 },
      { id: 'b3', name: "Pallof Press", detail: "2 Sätze x 10-12/Seite", link: "https://www.fitbook.de/fitness/pallof-press-effektiver-als-plank", sets: true, defaultReps: 10 },
      { id: 'b4', name: "Superman Pulls", detail: "2-3 Sätze x 10-12", link: "https://www.fitkurs.de/uebungen/supermann/", sets: true, defaultReps: 10 },

      { id: 'c3', name: "Kniebeugen", detail: "3 Sätze x 15-20", link: "https://dieringe.com/de/exercises/kniebeugen", sets: true, defaultReps: 15 },
      { id: 'c4', name: "Ausfallschritte", detail: "2-3 Sätze x 10/Bein", link: "https://dieringe.com/de/exercises/ausfallschritte", sets: true, defaultReps: 15 },
      { id: 'c5', name: "Glute Bridge", detail: "1 Min isometrisch / 1 Min dynamisch", link: "https://www.fitkurs.de/uebungen/beckenheben/", timed: true, targetSec: 60 },

const optional = [
  { id: 'o0', name: "Bird - Dog" },
  { id: 'o1', name: "Dead Bug" },
  { id: 'o2', name: "Deep Squat" },
  { id: 'o3', name: "Burpee" },
  { id: 'o4', name: "Rope Jumping" },
];

// Rotation-Anker: 28.07.2026 = Tag C
const ANCHOR_DATE = new Date(2026, 6, 28); // Monat 0-indexiert: 6 = Juli
const ROTATION_ORDER = ['A', 'B', 'C'];
const ANCHOR_INDEX = 2; // 'C'

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function startOfDay(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function getLetterForDate(d) {
  const day = startOfDay(d);
  const anchor = startOfDay(ANCHOR_DATE);
  const diffDays = Math.round((day - anchor) / 86400000);
  let idx = (ANCHOR_INDEX + diffDays) % 3;
  if (idx < 0) idx += 3;
  return ROTATION_ORDER[idx];
}

function getTodayLetter() {
  return getLetterForDate(new Date());
}

// ---------- Speicherung ----------
const STORAGE_KEY = 'fitness_progress';

function loadAllProgress() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function saveAllProgress(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getTodayProgress() {
  const all = loadAllProgress();
  const key = dateKey(new Date());
  return all[key] || {};
}

function setExerciseDone(exerciseId, done) {
  const all = loadAllProgress();
  const key = dateKey(new Date());
  if (!all[key]) all[key] = {};
  all[key][exerciseId] = done;
  saveAllProgress(all);
  markDirty(key);
}

function resetToday() {
  const all = loadAllProgress();
  const key = dateKey(new Date());
  all[key] = {};
  saveAllProgress(all);
  markDirty(key);
  render();
}

function getExerciseExtra(exerciseId, suffix) {
  const all = loadAllProgress();
  const key = dateKey(new Date());
  const day = all[key] || {};
  return day[exerciseId + suffix];
}

function setExerciseExtra(exerciseId, suffix, value) {
  const all = loadAllProgress();
  const key = dateKey(new Date());
  if (!all[key]) all[key] = {};
  all[key][exerciseId + suffix] = value;
  saveAllProgress(all);
  markDirty(key);
}

function getSideEntries(id) {
  return getExerciseExtra(id, '__sides') || [];
}

function setSideEntries(id, arr) {
  setExerciseExtra(id, '__sides', arr);
}

function getSetEntries(id, defaultReps) {
  const stored = getExerciseExtra(id, '__sets');
  return stored || [defaultReps];
}

function setSetEntries(id, arr) {
  setExerciseExtra(id, '__sets', arr);
}

function getDurationEntry(id) {
  return getExerciseExtra(id, '__duration') || null;
}

function setDurationEntry(id, ms) {
  setExerciseExtra(id, '__duration', ms);
}

// ---------- Protokollierung / GitHub-Sync ----------
const DIRTY_KEY = 'fitness_dirty_dates';
const MIGRATED_KEY = 'fitness_migrated_v1';
const SYNC_TOKEN_KEY = 'github_sync_token';
const SYNC_OWNER = 'JayArgh-root';
const SYNC_REPO = 'my-training-WebApp';
const SYNC_PATH = 'training-log.json';
const SYNC_BRANCH = 'main';

function getDirtyDates() {
  try {
    return JSON.parse(localStorage.getItem(DIRTY_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function markDirty(dateStr) {
  const dirty = getDirtyDates();
  if (!dirty.includes(dateStr)) {
    dirty.push(dateStr);
    localStorage.setItem(DIRTY_KEY, JSON.stringify(dirty));
  }
  scheduleSyncFlush();
}

function clearDirty(dateStrs) {
  const remaining = getDirtyDates().filter(d => !dateStrs.includes(d));
  localStorage.setItem(DIRTY_KEY, JSON.stringify(remaining));
}

function getApplicableExerciseIds(dateStr) {
  const letter = getLetterForDate(new Date(dateStr + 'T00:00:00'));
  return [...warmup, ...days[letter].exercises, ...optional].map(ex => ex.id);
}

// Baut den vollständigen Protokoll-Datensatz für einen Tag aus dem lokalen
// Speicher - unabhängig davon, ob der Tag "heute" ist oder ein Datum aus der
// Vergangenheit (relevant für die einmalige Migration alter Daten).
function buildDayRecord(dateStr) {
  const all = loadAllProgress();
  const dayProgress = all[dateStr] || {};
  const letter = getLetterForDate(new Date(dateStr + 'T00:00:00'));
  const ids = getApplicableExerciseIds(dateStr);

  const done = {};
  ids.forEach(id => { done[id] = !!dayProgress[id]; });

  const record = { date: dateStr, dayType: letter, done };

  const durations = {};
  const durationIds = [...warmup, ...days[letter].exercises].filter(ex => ex.durationTrack).map(ex => ex.id);
  durationIds.forEach(id => {
    const val = dayProgress[id + '__duration'];
    if (val) durations[id] = val;
  });
  if (Object.keys(durations).length) record.durations = durations;

  const sidePlank = {};
  const sideIds = [...warmup, ...days[letter].exercises].filter(ex => ex.sideTrack).map(ex => ex.id);
  sideIds.forEach(id => {
    const val = dayProgress[id + '__sides'];
    if (val && val.length) sidePlank[id] = val;
  });
  if (Object.keys(sidePlank).length) record.sidePlank = sidePlank;

  const sets = {};
  const setIds = [...warmup, ...days[letter].exercises].filter(ex => ex.sets).map(ex => ex.id);
  setIds.forEach(id => {
    const val = dayProgress[id + '__sets'];
    if (val && val.length) sets[id] = val;
  });
  if (Object.keys(sets).length) record.sets = sets;

  return record;
}

function getSyncToken() {
  return localStorage.getItem(SYNC_TOKEN_KEY) || '';
}

function setSyncToken(token) {
  if (token) localStorage.setItem(SYNC_TOKEN_KEY, token);
  else localStorage.removeItem(SYNC_TOKEN_KEY);
}

let syncFlushTimer = null;
let syncInProgress = false;

function scheduleSyncFlush() {
  if (syncFlushTimer) clearTimeout(syncFlushTimer);
  syncFlushTimer = setTimeout(() => { syncFlush(); }, 1500);
  updateSyncStatusUI();
}

function base64EncodeAscii(str) {
  return btoa(str);
}

function base64DecodeAscii(b64) {
  return atob(b64.replace(/\n/g, ''));
}

async function syncFlush() {
  if (syncInProgress) return;
  const token = getSyncToken();
  if (!token) { updateSyncStatusUI(); return; }
  if (!navigator.onLine) { updateSyncStatusUI(); return; }
  const dirty = getDirtyDates();
  if (!dirty.length) { updateSyncStatusUI(); return; }

  syncInProgress = true;
  updateSyncStatusUI();

  const apiUrl = `https://api.github.com/repos/${SYNC_OWNER}/${SYNC_REPO}/contents/${SYNC_PATH}`;
  const headers = {
    'Authorization': `Bearer ${token}`,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  };

  const maxAttempts = 3;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    try {
      let sha = undefined;
      let remote = { days: {} };

      const getRes = await fetch(`${apiUrl}?ref=${SYNC_BRANCH}`, { headers });
      if (getRes.status === 200) {
        const body = await getRes.json();
        sha = body.sha;
        try {
          remote = JSON.parse(base64DecodeAscii(body.content)) || { days: {} };
          if (!remote.days) remote.days = {};
        } catch (e) {
          remote = { days: {} };
        }
      } else if (getRes.status !== 404) {
        throw new Error(`GET fehlgeschlagen: ${getRes.status}`);
      }

      const pushedDates = dirty.slice();
      pushedDates.forEach(dateStr => {
        remote.days[dateStr] = buildDayRecord(dateStr);
      });

      const content = base64EncodeAscii(JSON.stringify(remote, null, 2));
      const putBody = {
        message: `Trainingsprotokoll aktualisiert (${pushedDates.join(', ')})`,
        content,
        branch: SYNC_BRANCH,
      };
      if (sha) putBody.sha = sha;

      const putRes = await fetch(apiUrl, {
        method: 'PUT',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify(putBody),
      });

      if (putRes.status === 200 || putRes.status === 201) {
        clearDirty(pushedDates);
        syncInProgress = false;
        setLastSyncStatus('ok');
        updateSyncStatusUI();
        return;
      } else if (putRes.status === 409 && attempt < maxAttempts - 1) {
        continue; // Konflikt: erneut lesen, mergen, schreiben
      } else {
        throw new Error(`PUT fehlgeschlagen: ${putRes.status}`);
      }
    } catch (e) {
      syncInProgress = false;
      setLastSyncStatus('error', e.message);
      updateSyncStatusUI();
      return;
    }
  }
  syncInProgress = false;
  setLastSyncStatus('error', 'Konflikt konnte nicht aufgelöst werden');
  updateSyncStatusUI();
}

function setLastSyncStatus(state, message) {
  const info = { state, message: message || '', at: new Date().toISOString() };
  localStorage.setItem('fitness_sync_status', JSON.stringify(info));
}

function getLastSyncStatus() {
  try {
    return JSON.parse(localStorage.getItem('fitness_sync_status')) || null;
  } catch (e) {
    return null;
  }
}

function updateSyncStatusUI() {
  const el = document.getElementById('sync-status-text');
  if (!el) return;
  const token = getSyncToken();
  if (!token) {
    el.textContent = 'Kein Token hinterlegt – Protokoll wird nur lokal gespeichert.';
    return;
  }
  const dirty = getDirtyDates();
  if (syncInProgress) {
    el.textContent = 'Synchronisiere…';
    return;
  }
  if (dirty.length) {
    el.textContent = navigator.onLine
      ? `Sync ausstehend (${dirty.length} Tag${dirty.length === 1 ? '' : 'e'})…`
      : `Offline – ${dirty.length} Tag${dirty.length === 1 ? '' : 'e'} werden bei nächster Verbindung übertragen.`;
    return;
  }
  const status = getLastSyncStatus();
  if (status && status.state === 'error') {
    el.textContent = `Sync-Fehler: ${status.message || 'unbekannt'} – Token prüfen.`;
    return;
  }
  if (status && status.state === 'ok') {
    const d = new Date(status.at);
    el.textContent = `✓ Synchronisiert (${d.toLocaleDateString('de-DE')} ${d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })})`;
    return;
  }
  el.textContent = 'Noch nicht synchronisiert.';
}

// Einmalige Migration: bereits vorhandene lokale Trainingstage (aus der Zeit
// vor der Protokollierungs-Funktion) beim ersten Start als "dirty" markieren,
// damit sie beim nächsten Sync mit in die GitHub-Datei aufgenommen werden.
function migrateExistingDataIfNeeded() {
  if (localStorage.getItem(MIGRATED_KEY)) return;
  const all = loadAllProgress();
  const dates = Object.keys(all);
  if (dates.length) {
    const dirty = getDirtyDates();
    dates.forEach(d => { if (!dirty.includes(d)) dirty.push(d); });
    localStorage.setItem(DIRTY_KEY, JSON.stringify(dirty));
  }
  localStorage.setItem(MIGRATED_KEY, '1');
}

window.addEventListener('online', () => scheduleSyncFlush());

// ---------- Statistik ----------
const WEEKDAY_LABELS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const MONTH_LABELS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

let statsCurrentYear = null;
let statsCurrentMonth = null;
let statsDataCache = null; // { [dateStr]: dayRecord }

async function fetchRemoteLog() {
  try {
    const url = `https://raw.githubusercontent.com/${SYNC_OWNER}/${SYNC_REPO}/${SYNC_BRANCH}/${SYNC_PATH}?t=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return null;
    const data = await res.json();
    return (data && data.days) ? data.days : {};
  } catch (e) {
    return null;
  }
}

function getAllLocalDayKeys() {
  return Object.keys(loadAllProgress());
}

async function loadStatsData() {
  const remote = await fetchRemoteLog();
  const merged = remote ? { ...remote } : {};
  // Lokale Tage überschreiben den Remote-Stand (aktuellster Wissensstand
  // dieses Geräts, insbesondere für noch nicht synchronisierte Änderungen).
  getAllLocalDayKeys().forEach(dateStr => { merged[dateStr] = buildDayRecord(dateStr); });
  statsDataCache = merged;
}

function computeDayStats(record) {
  const dayExercises = days[record.dayType] ? days[record.dayType].exercises : [];
  const warmupDone = warmup.filter(ex => record.done[ex.id]).length;
  const strengthDone = dayExercises.filter(ex => record.done[ex.id]).length;
  const optionalDone = optional.some(ex => record.done[ex.id]);
  return {
    warmupFrac: warmup.length ? warmupDone / warmup.length : 0,
    strengthFrac: dayExercises.length ? strengthDone / dayExercises.length : 0,
    optionalDone,
    warmupDone, warmupTotal: warmup.length,
    strengthDone, strengthTotal: dayExercises.length,
  };
}

function buildRingsSVG(size, warmupFrac, strengthFrac, optionalDone) {
  const stroke = size * 0.11;
  const cx = size / 2, cy = size / 2;
  const rOuter = size / 2 - stroke / 2 - 1;
  const rInner = rOuter - stroke - 2;
  const dotR = Math.max(2, size * 0.06);

  const ring = (r, frac, color) => {
    const c = 2 * Math.PI * r;
    const off = c * (1 - Math.max(0, Math.min(1, frac)));
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(52,55,58,0.14)" stroke-width="${stroke}" />` +
      `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})" />`;
  };

  const dot = optionalDone
    ? `<circle cx="${cx}" cy="${cy}" r="${dotR}" fill="var(--accent)" />`
    : `<circle cx="${cx}" cy="${cy}" r="${dotR}" fill="none" stroke="rgba(52,55,58,0.25)" stroke-width="1.3" />`;

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">` +
    ring(rOuter, warmupFrac, 'var(--accent)') +
    ring(rInner, strengthFrac, 'var(--ring-strength)') +
    dot +
    `</svg>`;
}

function openStatsView() {
  const view = document.getElementById('stats-view');
  view.classList.add('open');
  view.setAttribute('aria-hidden', 'false');
  const today = new Date();
  statsCurrentYear = today.getFullYear();
  statsCurrentMonth = today.getMonth();
  renderStatsCalendarLoading();
  loadStatsData().then(renderStatsCalendar);
}

function closeStatsView() {
  const view = document.getElementById('stats-view');
  view.classList.remove('open');
  view.setAttribute('aria-hidden', 'true');
}

function renderStatsCalendarLoading() {
  document.getElementById('stats-month-label').textContent = `${MONTH_LABELS[statsCurrentMonth]} ${statsCurrentYear}`;
  document.getElementById('stats-weekday-row').innerHTML = WEEKDAY_LABELS.map(l => `<div class="weekday-label">${l}</div>`).join('');
  document.getElementById('stats-calendar-grid').innerHTML = '<div class="stats-loading">Lade…</div>';
}

function renderStatsCalendar() {
  document.getElementById('stats-month-label').textContent = `${MONTH_LABELS[statsCurrentMonth]} ${statsCurrentYear}`;

  const grid = document.getElementById('stats-calendar-grid');
  grid.innerHTML = '';

  const firstOfMonth = new Date(statsCurrentYear, statsCurrentMonth, 1);
  const daysInMonth = new Date(statsCurrentYear, statsCurrentMonth + 1, 0).getDate();
  let leadingBlanks = firstOfMonth.getDay() - 1; // JS: 0=So..6=Sa -> Woche beginnt Montag
  if (leadingBlanks < 0) leadingBlanks = 6;

  for (let i = 0; i < leadingBlanks; i++) {
    const blank = document.createElement('div');
    blank.className = 'day-cell day-cell-blank';
    grid.appendChild(blank);
  }

  const todayStr = dateKey(new Date());

  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = dateKey(new Date(statsCurrentYear, statsCurrentMonth, d));
    const record = statsDataCache ? statsDataCache[dStr] : null;

    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'day-cell' + (dStr === todayStr ? ' today' : '');

    const stats = record ? computeDayStats(record) : { warmupFrac: 0, strengthFrac: 0, optionalDone: false };
    const numClass = record ? '' : ' muted';
    cell.innerHTML = buildRingsSVG(40, stats.warmupFrac, stats.strengthFrac, stats.optionalDone) +
      `<div class="day-cell-num${numClass}">${d}</div>`;

    if (record) {
      cell.addEventListener('click', () => openDayDetail(dStr, record));
    } else {
      cell.disabled = true;
    }
    grid.appendChild(cell);
  }
}

function buildDayDetailSection(title, exercises, record) {
  const section = document.createElement('div');
  section.className = 'day-detail-section';

  const h3 = document.createElement('h3');
  h3.textContent = title;
  section.appendChild(h3);

  const list = document.createElement('ul');
  list.className = 'day-detail-list';

  exercises.forEach(ex => {
    const li = document.createElement('li');
    const done = !!record.done[ex.id];
    li.className = 'day-detail-item' + (done ? ' done' : '');

    let extra = '';
    if (record.durations && record.durations[ex.id]) {
      extra = `<span class="day-detail-extra">${formatTime(record.durations[ex.id])}</span>`;
    } else if (record.sidePlank && record.sidePlank[ex.id] && record.sidePlank[ex.id].length) {
      extra = `<span class="day-detail-extra">${record.sidePlank[ex.id].map(formatTime).join(', ')}</span>`;
    } else if (record.sets && record.sets[ex.id] && record.sets[ex.id].length) {
      const setsArr = record.sets[ex.id];
      const total = setsArr.reduce((a, b) => a + b, 0);
      extra = `<span class="day-detail-extra">${setsArr.join(', ')} (${total} gesamt)</span>`;
    }

    const checkEl = document.createElement('span');
    checkEl.className = 'day-detail-check';
    checkEl.textContent = '✓';
    const nameEl = document.createElement('span');
    nameEl.className = 'day-detail-name';
    nameEl.textContent = ex.name;

    li.appendChild(checkEl);
    li.appendChild(nameEl);
    if (extra) li.insertAdjacentHTML('beforeend', extra);
    list.appendChild(li);
  });

  section.appendChild(list);
  return section;
}

// ---------- Stoppuhr ----------
const timerStates = {};
let wakeLock = null;

function getTimerState(id) {
  if (!timerStates[id]) {
    timerStates[id] = { running: false, elapsedMs: 0, startedAt: 0, intervalId: null, displayEl: null, startStopBtnEl: null, targetMs: null };
  }
  return timerStates[id];
}

function registerTimer(id, refs) {
  const st = getTimerState(id);
  st.displayEl = refs.displayEl;
  st.startStopBtnEl = refs.startStopBtnEl;
  st.targetMs = refs.targetMs || null;
}

function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function fitTimerDisplay(el) {
  // Ermittelt per Bisektion die größtmögliche Schriftgröße, mit der "00:00"
  // gerade noch (mit kleinem Puffer) in die verfügbare Breite passt.
  // WICHTIG: el selbst hat width:100% und ist daher IMMER so breit wie das
  // Panel - el.scrollWidth ist deshalb ungeeignet zum Messen (bleibt bei
  // nicht-überlaufendem Text gleich el.clientWidth, schrumpft nie mit der
  // Schrift). Stattdessen misst ein unsichtbares, frei fließendes Hilfselement
  // (ohne width:100%-Zwang) die tatsächliche Textbreite je Kandidatengröße.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const panel = el.parentElement;
      const containerWidth = (panel || el).getBoundingClientRect().width;
      if (!containerWidth) return;

      const cs = getComputedStyle(el);
      const probe = document.createElement('span');
      probe.style.position = 'absolute';
      probe.style.left = '-9999px';
      probe.style.top = '0';
      probe.style.visibility = 'hidden';
      probe.style.whiteSpace = 'nowrap';
      probe.style.fontFamily = cs.fontFamily;
      probe.style.fontWeight = cs.fontWeight;
      probe.style.letterSpacing = cs.letterSpacing;
      probe.style.fontVariantNumeric = cs.fontVariantNumeric;
      probe.textContent = el.textContent || '00:00';
      document.body.appendChild(probe);

      let lo = 20;
      let hi = 220;
      let best = lo;
      for (let i = 0; i < 16; i++) {
        const mid = (lo + hi) / 2;
        probe.style.fontSize = mid + 'px';
        if (probe.offsetWidth <= containerWidth * 0.96) {
          best = mid;
          lo = mid;
        } else {
          hi = mid;
        }
      }
      document.body.removeChild(probe);
      el.style.fontSize = best + 'px';
    });
  });
}

function updateTimerDisplay(id) {
  const st = timerStates[id];
  if (!st || !st.displayEl) return;
  const current = st.running ? st.elapsedMs + (Date.now() - st.startedAt) : st.elapsedMs;
  st.displayEl.textContent = formatTime(current);
  const reached = st.targetMs != null && current >= st.targetMs;
  st.displayEl.classList.toggle('target-reached', reached);
}

function updateTimerButton(id) {
  const st = timerStates[id];
  if (!st || !st.startStopBtnEl) return;
  st.startStopBtnEl.textContent = st.running ? 'Stopp' : 'Start';
  st.startStopBtnEl.classList.toggle('running', st.running);
}

function anyTimerRunning() {
  return Object.values(timerStates).some(st => st.running);
}

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  if (wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) {
    // z.B. Akkusparmodus oder Berechtigung verweigert - Stoppuhr funktioniert trotzdem weiter
  }
}

async function releaseWakeLockIfIdle() {
  if (anyTimerRunning() || !wakeLock) return;
  try {
    await wakeLock.release();
  } catch (e) {
    // ignorieren
  }
  wakeLock = null;
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && anyTimerRunning()) {
    requestWakeLock();
  }
});

function startTimer(id) {
  const st = getTimerState(id);
  if (st.running) return;
  st.running = true;
  st.startedAt = Date.now();
  st.intervalId = setInterval(() => updateTimerDisplay(id), 250);
  requestWakeLock();
  updateTimerButton(id);
}

function stopTimer(id) {
  const st = timerStates[id];
  if (!st || !st.running) return;
  st.elapsedMs += Date.now() - st.startedAt;
  st.running = false;
  if (st.intervalId) clearInterval(st.intervalId);
  st.intervalId = null;
  updateTimerDisplay(id);
  updateTimerButton(id);
  releaseWakeLockIfIdle();
}

function resetTimer(id) {
  const st = timerStates[id];
  if (!st) return;
  if (st.intervalId) clearInterval(st.intervalId);
  st.running = false;
  st.intervalId = null;
  st.elapsedMs = 0;
  st.startedAt = 0;
  updateTimerDisplay(id);
  updateTimerButton(id);
  releaseWakeLockIfIdle();
}

  updateSectionCheckbox('day');

}

// Fixierten Header-Bereich exakt so hoch reservieren, wie er tatsächlich ist.
// Läuft nicht nur einmalig, sondern beobachtet den Header laufend: auf iOS kann sich
// seine tatsächliche Höhe nach dem ersten Messen noch leicht verschieben (Safe-Area/
// Dynamic-Island-Timing, Zeilenumbruch bei Datum/Tag-Badge) - eine einmalige Messung
// führte dazu, dass der Seiteninhalt knapp zu weit oben startete und teilweise unter
// dem fixierten Header verschwand.
function syncHeaderHeight() {
  const header = document.querySelector('header');
  if (header) {
    document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
  }
}
syncHeaderHeight();
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('orientationchange', syncHeaderHeight);
window.addEventListener('pageshow', syncHeaderHeight);
if ('ResizeObserver' in window) {
  const headerEl = document.querySelector('header');
  if (headerEl) {
    new ResizeObserver(syncHeaderHeight).observe(headerEl);
  }
}

  const circle = document.getElementById('splash-circle');
  const personImg = document.getElementById('splash-person');
  const logoSlot = document.getElementById('logo-slot');

  if (!splash || !svgEl || !iconGroup) return;

  // Sicherheitsnetz: falls irgendetwas hakt, Splash spätestens nach 4.5s entfernen
  const fallbackTimer = setTimeout(finishSplash, 4500);

  function drawIn(el, durationMs, delayMs) {
    const len = el.getTotalLength();
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
    // erzwingt Reflow, damit der Übergang von diesem Startwert aus greift
    el.getBoundingClientRect();
    el.style.transition = `stroke-dashoffset ${durationMs}ms ease ${delayMs}ms`;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        el.style.strokeDashoffset = '0';
      });
    });
  }

  // Reihenfolge: Person (Fade-in, doppelt so lang) -> Quadrat -> Kreis -> kurze Pause -> Logo
  personImg.style.transition = 'opacity 1400ms ease';
  setTimeout(() => { personImg.style.opacity = '1'; }, 50);

  drawIn(square, 300, 500);
  drawIn(circle, 300, 800);

  setTimeout(moveToLogo, 1500); // Kreis fertig bei 1100ms + 400ms Pause; startet bewusst, bevor die Person (Fade-in bis ~1450ms) vollständig eingeblendet ist

  function moveToLogo() {
    if (!logoSlot) { finishSplash(); return; }
    const targetRect = logoSlot.getBoundingClientRect();
    const sourceRect = iconGroup.getBoundingClientRect();

    if (targetRect.width === 0 || sourceRect.width === 0) { finishSplash(); return; }

    // Die Gruppe liegt innerhalb eines skalierten SVG-viewBox-Koordinatensystems.
    // CSS-Transform-Werte (px) auf ihr wirken in diesen lokalen SVG-Einheiten, nicht
    // in echten Bildschirm-Pixeln. Ohne Umrechnung würde die Strecke falsch skaliert,
    // wodurch das Icon über das Ziel hinausschießt (scheint "aus dem Bildschirm zu schweben").
    const ctm = iconGroup.getScreenCTM();
    if (!ctm) { finishSplash(); return; }
    const k = Math.hypot(ctm.a, ctm.b) || 1; // Skala: Bildschirm-Pixel pro SVG-Nutzereinheit

    const scale = targetRect.width / sourceRect.width; // dimensionsloses Verhältnis, unabhängig vom Koordinatensystem
    const dxScreen = (targetRect.left + targetRect.width / 2) - (sourceRect.left + sourceRect.width / 2);
    const dyScreen = (targetRect.top + targetRect.height / 2) - (sourceRect.top + sourceRect.height / 2);
    const dx = dxScreen / k;
    const dy = dyScreen / k;

    iconGroup.style.transition = 'transform 700ms cubic-bezier(0.4, 0, 0.2, 1)';
    iconGroup.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    splash.style.transition = 'opacity 300ms ease 500ms';
    splash.style.opacity = '0';

    iconGroup.addEventListener('transitionend', finishSplash, { once: true });
    // zusätzliches Sicherheitsnetz für diesen Schritt
    setTimeout(finishSplash, 1400);
  }

  function finishSplash() {
    clearTimeout(fallbackTimer);
    if (splash.dataset.done === '1') return;
    splash.dataset.done = '1';
    splash.style.display = 'none';
    if (logoSlot && !logoSlot.querySelector('img')) {
      const logoImg = document.createElement('img');
      logoImg.src = 'App Icon/icon-180.png';
      logoImg.alt = 'Logo';
      logoSlot.appendChild(logoImg);
    }
  }
})();

// Service Worker registrieren (für Offline-Nutzung)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
