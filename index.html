<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Training</title>

<!-- iOS Home-Bildschirm / PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="apple-touch-icon" href="App Icon/icon-180.png">
<link rel="icon" href="App Icon/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.json">
<!-- iOS-Launch-Screen (iPhone 12 mini): iOS ignoriert manifest.json background_color hierfuer,
     das ist der einzige von Apple unterstuetzte Weg. Zeigt das leere Pergament (identisch zum
     ersten Frame des Splash-Screens) statt weissem Blitz. iPhone 12 mini rendert CSS-Media-Queries
     unter der "Punkte-Klasse" des iPhone 11 Pro (375x812pt @3x = 1125x2436px), NICHT unter der
     physischen Panel-Aufloesung (1080x2340) - Apples eigene Kompatibilitaets-Eigenheit. -->
<link rel="apple-touch-startup-image" href="Splash screen/apple-splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
<meta name="theme-color" content="#cbb897">

<style>
  :root {
    color-scheme: light;
    --bg-image: url('Splash screen/bg-full.png');
    --header-bg: #cbb897;
    --card: #e7dcc4;
    --accent: #4fd1a5;
    --text: #34373a;
    --muted: #6b6f73;
    --done: #dbe8d6;
    --section-bg: #95ddbe;
    --line: rgba(52,55,58,0.28);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background-color: #c9b291; /* Fallback, das eigentliche Bild liefert #page-bg */
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* body bekommt einen eigenen Stacking-Context (position:relative), damit #page-bg
     mit negativem z-index nicht gegen den Wurzel-/Canvas-Stacking-Context arbeitet -
     dort kommt es auf iOS Safari vereinzelt vor, dass ein fixed-Element mit negativem
     z-index gar nicht gerendert wird, gerade wenn andere fixed-Elemente (unser Splash)
     zwischenzeitlich ein-/ausgeblendet werden. Innerhalb eines eigenen, lokalen
     Stacking-Contexts arbeitet dieselbe negative-z-index-Technik zuverlässig. */
  body {
    position: relative;
    z-index: 0;
  }
  /* Eigenes fixiertes Hintergrund-Element statt background-attachment:fixed auf body:
     iOS Safari setzt beim Rubber-Band-Overscroll einen fixed *background* nicht korrekt
     fort (zeigt dort Weiß). Ein echtes position:fixed-Element wird dagegen zuverlässig
     auch im Überzieh-Bereich dargestellt. */
  #page-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    -webkit-transform: translateZ(0); /* erzwingt eigene Compositing-Ebene */
    background: var(--bg-image) center / cover no-repeat;
  }
  body {
    padding: 0 16px calc(env(safe-area-inset-bottom) + 24px) 16px;
    padding-top: var(--header-h, 168px);
    max-width: 560px;
    margin: 0 auto;
  }
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 500;
    background: var(--header-bg);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 8px 16px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    box-shadow: 0 6px 10px -4px rgba(30, 24, 14, 0.35);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    max-width: 560px;
    margin: 0 auto;
  }
  .logo-slot {
    flex: 0 0 46px;
    width: 46px;
    height: 46px;
    border-radius: 11px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(30, 24, 14, 0.4);
  }
  .logo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .header-text {
    text-align: left;
  }
  header h1 {
    font-size: 1.1rem;
    margin: 0 0 2px 0;
    color: var(--text);
  }
  header .date {
    color: var(--muted);
    font-size: 0.78rem;
  }

  /* ---------- Splash Screen ---------- */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #c9b291 var(--bg-image) center / cover no-repeat;
  }
  #splash-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  #splash-svg .draw-line {
    fill: none;
    stroke: #4a4e52; /* anthrazit statt Tinten-Braun */
    stroke-width: 0.8;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  #splash-person {
    opacity: 0;
  }
  #icon-group {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .day-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 14px;
    border-radius: 999px;
    background: var(--accent);
    color: #06231a;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .progress {
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  section.section-box {
    margin-top: 22px;
    background: var(--section-bg);
    border-radius: 16px;
    padding: 14px 14px 6px 14px;
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 10px 4px;
  }
  .section-header h2 {
    flex: 1;
    font-size: 1rem;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    margin: 0;
  }
  .collapse-btn {
    flex: 0 0 auto;
    background: none;
    border: none;
    padding: 4px;
    margin: 0 4px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    cursor: pointer;
  }
  .collapse-btn .chevron {
    transition: transform 180ms ease;
  }
  .section-box.collapsed .collapse-btn .chevron {
    transform: rotate(-90deg);
  }
  .section-box.collapsed ul.exercise-list {
    display: none;
  }
  ul.exercise-list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: transparent;
    border-radius: 14px;
    overflow: hidden;
  }
  li.exercise {
    display: block;
    padding: 14px 14px;
    border-bottom: 1px solid rgba(52,55,58,0.1);
    background: var(--done);
  }
  li.exercise:last-child { border-bottom: none; }
  .exercise-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .checkbox {
    flex: 0 0 26px;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: transparent;
  }
  li.exercise.done .checkbox,
  .checkbox.checked {
    background: var(--accent);
    border-color: var(--accent);
    color: #06231a;
  }
  .exercise-info { flex: 1; min-width: 0; }
  .name-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .exercise-name {
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    color: var(--text);
  }
  .link-icon {
    flex: 0 0 auto;
    display: inline-flex;
    color: var(--muted);
  }
  .exercise-detail {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .timer-toggle-btn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 1px;
    background: none;
    border: none;
    padding: 4px;
    margin: 0;
    color: var(--muted);
    cursor: pointer;
  }
  .timer-toggle-btn .chevron {
    transition: transform 180ms ease;
    transform: rotate(-90deg);
  }
  .timer-toggle-btn.expanded .chevron {
    transform: rotate(0deg);
  }
  .timer-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(52,55,58,0.15);
  }
  li.exercise.timer-open .timer-panel {
    display: block;
  }
  .timer-display {
    font-size: 7.5rem;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    color: var(--text);
    margin-bottom: 14px;
    border-radius: 14px;
    background: transparent;
    transition: background-color 200ms ease;
  }
  .timer-display.target-reached {
    background: #4fd1a5;
  }
  .timer-buttons {
    display: flex;
    gap: 10px;
  }
  .timer-buttons button {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  .timer-startstop {
    background: var(--accent);
    color: #06231a;
  }
  .timer-startstop.running {
    background: #d64f4f;
    color: #fff;
  }
  .timer-buttons button.timer-reset {
    background: none;
    border: 1.5px solid rgba(52,55,58,0.45);
    color: var(--muted);
  }
  footer {
    margin-top: 30px;
    text-align: center;
  }
  button.reset {
    background: none;
    border: 1px solid rgba(52,55,58,0.25);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<div id="page-bg" aria-hidden="true"></div>

<div id="splash" aria-hidden="true">
  <!-- Pergament-Hintergrund kommt jetzt als CSS-background auf #splash (siehe <style>),
       damit er stets randlos abdeckt, unabhängig vom viewBox-"meet" der Figur darunter. -->
  <svg id="splash-svg" viewBox="0 0 568 1020" preserveAspectRatio="xMidYMid meet">
    <!-- Person, Quadrat, Kreis - das wandert später gemeinsam zum Logo -->
    <g id="icon-group">
      <image id="splash-person" href="Splash screen/person-icon-transparent.png" x="20" y="246" width="530" height="530" />
      <rect id="splash-square" class="draw-line" x="80" y="350" width="408" height="408" />
      <circle id="splash-circle" class="draw-line" cx="285.5" cy="511.5" r="244.9" />
    </g>
  </svg>
</div>

<header>
  <div class="header-top">
    <div class="logo-slot" id="logo-slot"></div>
    <div class="header-text">
      <h1>Mein Training</h1>
      <div class="date" id="today-date"></div>
    </div>
  </div>
  <div class="day-badge" id="day-badge"></div>
  <div class="progress" id="progress-text"></div>
</header>

<section class="section-box" id="warmup-section">
  <div class="section-header">
    <div class="checkbox section-checkbox" data-section="warmup" role="button" aria-label="Alle Warm-up-Übungen abhaken">✓</div>
    <h2>Warm-up</h2>
    <button class="collapse-btn" type="button" data-target="warmup-section" aria-label="Bereich auf-/zuklappen">
      <svg class="chevron" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 7l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <ul class="exercise-list" id="warmup-list"></ul>
</section>

<section class="section-box" id="day-section">
  <div class="section-header">
    <div class="checkbox section-checkbox" data-section="day" role="button" aria-label="Alle heutigen Übungen abhaken">✓</div>
    <h2 id="day-section-title">Heutiges Training</h2>
    <button class="collapse-btn" type="button" data-target="day-section" aria-label="Bereich auf-/zuklappen">
      <svg class="chevron" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 7l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <ul class="exercise-list" id="day-list"></ul>
</section>

<footer>
  <button class="reset" id="reset-btn">Heutige Häkchen zurücksetzen</button>
</footer>

<script>
// ---------- Daten ----------
const warmup = [
  { id: 'w0', name: "Plank", detail: "2 Min", link: "https://www.fitkurs.de/uebungen/unterarmstuetz/", timed: true, targetSec: 120 },
  { id: 'w1', name: "Haltung des Kindes", detail: "1 Min", link: "https://www.fitkurs.de/uebungen/stellung-des-kindes/", timed: true, targetSec: 60 },
  { id: 'w2', name: "Kobra", detail: "15 Sek" },
  { id: 'w3', name: "Katze-Kuh", detail: "10 Wdh.", link: "https://www.fitkurs.de/uebungen/katze-kuh/" },
  { id: 'w4', name: "Morning Stretch", detail: "30 Sek" },
  { id: 'w5', name: "Vorwärtsbeuge", detail: "15 Sek" },
  { id: 'w6', name: "World's Greatest Stretch", detail: "5 Wdh./Seite", link: "https://dieringe.com/de/exercises/worlds-greatest-stretch" },
];

const days = {
  A: {
    label: "Push",
    exercises: [
      { id: 'a2', name: "Seitliche Plank", detail: "1 Min/Seite", link: "https://www.fitkurs.de/uebungen/seitlicher-unterarmstuetz-einsteiger/", timed: true, targetSec: 60 },
      { id: 'a3', name: "Liegestütze", detail: "3 Sätze", link: "https://www.fitkurs.de/uebungen/liegestuetze/" },
      { id: 'a4', name: "Pallof Press", detail: "2 Sätze x 10-12/Seite", link: "https://www.fitbook.de/fitness/pallof-press-effektiver-als-plank" },
    ]
  },
  B: {
    label: "Pull",
    exercises: [
      { id: 'b2', name: "Klimmzüge", detail: "3 Sätze", link: "https://www.marathonfitness.de/klimmzuege-lernen/" },
      { id: 'b3', name: "Pallof Press", detail: "2 Sätze x 10-12/Seite", link: "https://www.fitbook.de/fitness/pallof-press-effektiver-als-plank" },
      { id: 'b4', name: "Superman Pulls", detail: "2-3 Sätze x 10-12", link: "https://www.fitkurs.de/uebungen/supermann/" },
    ]
  },
  C: {
    label: "Beine",
    exercises: [
      { id: 'c2', name: "Seitliche Plank", detail: "1 Min/Seite", link: "https://www.fitkurs.de/uebungen/seitlicher-unterarmstuetz-einsteiger/", timed: true, targetSec: 60 },
      { id: 'c3', name: "Kniebeugen", detail: "3 Sätze x 15-20", link: "https://dieringe.com/de/exercises/kniebeugen" },
      { id: 'c4', name: "Ausfallschritte", detail: "2-3 Sätze x 10/Bein", link: "https://dieringe.com/de/exercises/ausfallschritte" },
      { id: 'c5', name: "Glute Bridge", detail: "1 Min isometrisch / 1 Min dynamisch", link: "https://www.fitkurs.de/uebungen/beckenheben/", timed: true, targetSec: 60 },
      { id: 'c6', name: "Pallof Press im Ausfallschritt", detail: "2 Sätze x 10-12/Seite", link: "https://www.fitbook.de/fitness/pallof-press-effektiver-als-plank" },
    ]
  }
};

// Rotation-Anker: 28.07.2026 = Tag C
const ANCHOR_DATE = new Date(2026, 6, 28); // Monat 0-indexiert: 6 = Juli
const ROTATION_ORDER = ['A', 'B', 'C'];
const ANCHOR_INDEX = 2; // 'C'

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function startOfDay(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function getTodayLetter() {
  const today = startOfDay(new Date());
  const anchor = startOfDay(ANCHOR_DATE);
  const diffDays = Math.round((today - anchor) / 86400000);
  let idx = (ANCHOR_INDEX + diffDays) % 3;
  if (idx < 0) idx += 3;
  return ROTATION_ORDER[idx];
}

// ---------- Speicherung ----------
const STORAGE_KEY = 'fitness_progress';

function loadAllProgress() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function saveAllProgress(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getTodayProgress() {
  const all = loadAllProgress();
  const key = dateKey(new Date());
  return all[key] || {};
}

function setExerciseDone(exerciseId, done) {
  const all = loadAllProgress();
  const key = dateKey(new Date());
  if (!all[key]) all[key] = {};
  all[key][exerciseId] = done;
  saveAllProgress(all);
}

function resetToday() {
  const all = loadAllProgress();
  const key = dateKey(new Date());
  all[key] = {};
  saveAllProgress(all);
  render();
}

// ---------- Rendering ----------
const LINK_ICON_SVG = '<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M8 5H5a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1v-3M12 4h4v4M9 11l7-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CLOCK_ICON_SVG = '<svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6v4l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEVRON_SVG = '<svg class="chevron" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 7l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderList(container, items, progress, sectionKey) {
  container.innerHTML = '';
  items.forEach(ex => {
    const li = document.createElement('li');
    li.className = 'exercise' + (progress[ex.id] ? ' done' : '');
    li.dataset.id = ex.id;

    const row = document.createElement('div');
    row.className = 'exercise-row';

    const box = document.createElement('div');
    box.className = 'checkbox';
    box.textContent = '✓';

    const info = document.createElement('div');
    info.className = 'exercise-info';

    const nameRow = document.createElement('div');
    nameRow.className = 'name-row';

    const nameEl = document.createElement('span');
    nameEl.className = 'exercise-name';
    nameEl.textContent = ex.name;
    nameRow.appendChild(nameEl);

    if (ex.link) {
      const linkIcon = document.createElement('a');
      linkIcon.href = ex.link;
      linkIcon.target = '_blank';
      linkIcon.rel = 'noopener';
      linkIcon.className = 'link-icon';
      linkIcon.setAttribute('aria-label', 'Anleitung öffnen (externer Link)');
      linkIcon.innerHTML = LINK_ICON_SVG;
      linkIcon.addEventListener('click', (e) => e.stopPropagation());
      nameRow.appendChild(linkIcon);
    }

    const detail = document.createElement('span');
    detail.className = 'exercise-detail';
    detail.textContent = ex.detail;

    info.appendChild(nameRow);
    info.appendChild(detail);
    row.appendChild(box);
    row.appendChild(info);

    if (ex.timed) {
      const timerToggleBtn = document.createElement('button');
      timerToggleBtn.type = 'button';
      timerToggleBtn.className = 'timer-toggle-btn';
      timerToggleBtn.setAttribute('aria-label', 'Stoppuhr ein-/ausblenden');
      timerToggleBtn.innerHTML = CLOCK_ICON_SVG + CHEVRON_SVG;
      row.appendChild(timerToggleBtn);

      const panel = document.createElement('div');
      panel.className = 'timer-panel';

      const displayEl = document.createElement('div');
      displayEl.className = 'timer-display';
      displayEl.textContent = '00:00';

      const buttonsRow = document.createElement('div');
      buttonsRow.className = 'timer-buttons';

      const startStopBtn = document.createElement('button');
      startStopBtn.type = 'button';
      startStopBtn.className = 'timer-startstop';
      startStopBtn.textContent = 'Start';

      const resetBtn = document.createElement('button');
      resetBtn.type = 'button';
      resetBtn.className = 'timer-reset';
      resetBtn.textContent = 'Reset';

      buttonsRow.appendChild(startStopBtn);
      buttonsRow.appendChild(resetBtn);
      panel.appendChild(displayEl);
      panel.appendChild(buttonsRow);

      registerTimer(ex.id, { displayEl, startStopBtnEl: startStopBtn, targetMs: ex.targetSec ? ex.targetSec * 1000 : null });

      timerToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = li.classList.toggle('timer-open');
        timerToggleBtn.classList.toggle('expanded', isOpen);
        if (!isOpen) {
          stopTimer(ex.id);
        }
      });

      startStopBtn.addEventListener('click', () => {
        const st = getTimerState(ex.id);
        if (st.running) { stopTimer(ex.id); } else { startTimer(ex.id); }
      });

      resetBtn.addEventListener('click', () => {
        resetTimer(ex.id);
      });

      li.appendChild(row);
      li.appendChild(panel);
    } else {
      li.appendChild(row);
    }

    row.addEventListener('click', () => {
      const nowDone = !li.classList.contains('done');
      li.classList.toggle('done', nowDone);
      setExerciseDone(ex.id, nowDone);
      updateProgressText();
      if (sectionKey) updateSectionCheckbox(sectionKey);
    });

    container.appendChild(li);
  });
}

// ---------- Stoppuhr ----------
const timerStates = {};
let wakeLock = null;

function getTimerState(id) {
  if (!timerStates[id]) {
    timerStates[id] = { running: false, elapsedMs: 0, startedAt: 0, intervalId: null, displayEl: null, startStopBtnEl: null, targetMs: null };
  }
  return timerStates[id];
}

function registerTimer(id, refs) {
  const st = getTimerState(id);
  st.displayEl = refs.displayEl;
  st.startStopBtnEl = refs.startStopBtnEl;
  st.targetMs = refs.targetMs || null;
}

function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function updateTimerDisplay(id) {
  const st = timerStates[id];
  if (!st || !st.displayEl) return;
  const current = st.running ? st.elapsedMs + (Date.now() - st.startedAt) : st.elapsedMs;
  st.displayEl.textContent = formatTime(current);
  const reached = st.targetMs != null && current >= st.targetMs;
  st.displayEl.classList.toggle('target-reached', reached);
}

function updateTimerButton(id) {
  const st = timerStates[id];
  if (!st || !st.startStopBtnEl) return;
  st.startStopBtnEl.textContent = st.running ? 'Stopp' : 'Start';
  st.startStopBtnEl.classList.toggle('running', st.running);
}

function anyTimerRunning() {
  return Object.values(timerStates).some(st => st.running);
}

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  if (wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) {
    // z.B. Akkusparmodus oder Berechtigung verweigert - Stoppuhr funktioniert trotzdem weiter
  }
}

async function releaseWakeLockIfIdle() {
  if (anyTimerRunning() || !wakeLock) return;
  try {
    await wakeLock.release();
  } catch (e) {
    // ignorieren
  }
  wakeLock = null;
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && anyTimerRunning()) {
    requestWakeLock();
  }
});

function startTimer(id) {
  const st = getTimerState(id);
  if (st.running) return;
  st.running = true;
  st.startedAt = Date.now();
  st.intervalId = setInterval(() => updateTimerDisplay(id), 250);
  requestWakeLock();
  updateTimerButton(id);
}

function stopTimer(id) {
  const st = timerStates[id];
  if (!st || !st.running) return;
  st.elapsedMs += Date.now() - st.startedAt;
  st.running = false;
  if (st.intervalId) clearInterval(st.intervalId);
  st.intervalId = null;
  updateTimerDisplay(id);
  updateTimerButton(id);
  releaseWakeLockIfIdle();
}

function resetTimer(id) {
  const st = timerStates[id];
  if (!st) return;
  if (st.intervalId) clearInterval(st.intervalId);
  st.running = false;
  st.intervalId = null;
  st.elapsedMs = 0;
  st.startedAt = 0;
  updateTimerDisplay(id);
  updateTimerButton(id);
  releaseWakeLockIfIdle();
}

function getSectionItems(sectionKey) {
  if (sectionKey === 'warmup') return warmup;
  if (sectionKey === 'day') return days[getTodayLetter()].exercises;
  return [];
}

function updateSectionCheckbox(sectionKey) {
  const checkboxEl = document.querySelector(`.section-checkbox[data-section="${sectionKey}"]`);
  if (!checkboxEl) return;
  const items = getSectionItems(sectionKey);
  const progress = getTodayProgress();
  const allDone = items.length > 0 && items.every(ex => progress[ex.id]);
  checkboxEl.classList.toggle('checked', allDone);
}

function updateProgressText() {
  const progress = getTodayProgress();
  const letter = getTodayLetter();
  const allItems = [...warmup, ...days[letter].exercises];
  const doneCount = allItems.filter(ex => progress[ex.id]).length;
  document.getElementById('progress-text').textContent =
    `${doneCount} / ${allItems.length} erledigt`;
}

function render() {
  const today = new Date();
  const letter = getTodayLetter();
  const dayData = days[letter];
  const progress = getTodayProgress();

  document.getElementById('today-date').textContent =
    today.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  document.getElementById('day-badge').textContent = dayData.label;
  document.getElementById('day-section-title').textContent = dayData.label;

  renderList(document.getElementById('warmup-list'), warmup, progress, 'warmup');
  renderList(document.getElementById('day-list'), dayData.exercises, progress, 'day');
  updateProgressText();
  updateSectionCheckbox('warmup');
  updateSectionCheckbox('day');
}

document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('Heutige Häkchen wirklich zurücksetzen?')) {
    resetToday();
  }
});

document.querySelectorAll('.section-checkbox').forEach(cb => {
  cb.addEventListener('click', () => {
    const sectionKey = cb.dataset.section;
    const items = getSectionItems(sectionKey);
    if (!items.length) return;
    const progress = getTodayProgress();
    const allDone = items.every(ex => progress[ex.id]);
    const newState = !allDone;
    items.forEach(ex => setExerciseDone(ex.id, newState));

    const listId = sectionKey === 'warmup' ? 'warmup-list' : 'day-list';
    const listEl = document.getElementById(listId);
    if (listEl) {
      listEl.querySelectorAll('li.exercise').forEach(li => li.classList.toggle('done', newState));
    }
    cb.classList.toggle('checked', newState);
    updateProgressText();
  });
});

document.querySelectorAll('.collapse-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const box = document.getElementById(btn.dataset.target);
    if (!box) return;
    const nowCollapsed = box.classList.toggle('collapsed');
    if (nowCollapsed) {
      box.querySelectorAll('li.exercise.timer-open').forEach(li => {
        stopTimer(li.dataset.id);
        li.classList.remove('timer-open');
        const toggleBtn = li.querySelector('.timer-toggle-btn');
        if (toggleBtn) toggleBtn.classList.remove('expanded');
      });
    }
  });
});

render();

// Fixierten Header-Bereich exakt so hoch reservieren, wie er tatsächlich ist.
// Läuft nicht nur einmalig, sondern beobachtet den Header laufend: auf iOS kann sich
// seine tatsächliche Höhe nach dem ersten Messen noch leicht verschieben (Safe-Area/
// Dynamic-Island-Timing, Zeilenumbruch bei Datum/Tag-Badge) - eine einmalige Messung
// führte dazu, dass der Seiteninhalt knapp zu weit oben startete und teilweise unter
// dem fixierten Header verschwand.
function syncHeaderHeight() {
  const header = document.querySelector('header');
  if (header) {
    document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
  }
}
syncHeaderHeight();
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('orientationchange', syncHeaderHeight);
window.addEventListener('pageshow', syncHeaderHeight);
if ('ResizeObserver' in window) {
  const headerEl = document.querySelector('header');
  if (headerEl) {
    new ResizeObserver(syncHeaderHeight).observe(headerEl);
  }
}

// ---------- Splash-Screen-Animation ----------
(function runSplash() {
  const splash = document.getElementById('splash');
  const svgEl = document.getElementById('splash-svg');
  const iconGroup = document.getElementById('icon-group');
  const square = document.getElementById('splash-square');
  const circle = document.getElementById('splash-circle');
  const personImg = document.getElementById('splash-person');
  const logoSlot = document.getElementById('logo-slot');

  if (!splash || !svgEl || !iconGroup) return;

  // Sicherheitsnetz: falls irgendetwas hakt, Splash spätestens nach 4.5s entfernen
  const fallbackTimer = setTimeout(finishSplash, 4500);

  function drawIn(el, durationMs, delayMs) {
    const len = el.getTotalLength();
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
    // erzwingt Reflow, damit der Übergang von diesem Startwert aus greift
    el.getBoundingClientRect();
    el.style.transition = `stroke-dashoffset ${durationMs}ms ease ${delayMs}ms`;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        el.style.strokeDashoffset = '0';
      });
    });
  }

  // Reihenfolge: Person (Fade-in, doppelt so lang) -> Quadrat -> Kreis -> kurze Pause -> Logo
  personImg.style.transition = 'opacity 1400ms ease';
  setTimeout(() => { personImg.style.opacity = '1'; }, 50);

  drawIn(square, 300, 500);
  drawIn(circle, 300, 800);

  setTimeout(moveToLogo, 1500); // Kreis fertig bei 1100ms + 400ms Pause; startet bewusst, bevor die Person (Fade-in bis ~1450ms) vollständig eingeblendet ist

  function moveToLogo() {
    if (!logoSlot) { finishSplash(); return; }
    const targetRect = logoSlot.getBoundingClientRect();
    const sourceRect = iconGroup.getBoundingClientRect();

    if (targetRect.width === 0 || sourceRect.width === 0) { finishSplash(); return; }

    // Die Gruppe liegt innerhalb eines skalierten SVG-viewBox-Koordinatensystems.
    // CSS-Transform-Werte (px) auf ihr wirken in diesen lokalen SVG-Einheiten, nicht
    // in echten Bildschirm-Pixeln. Ohne Umrechnung würde die Strecke falsch skaliert,
    // wodurch das Icon über das Ziel hinausschießt (scheint "aus dem Bildschirm zu schweben").
    const ctm = iconGroup.getScreenCTM();
    if (!ctm) { finishSplash(); return; }
    const k = Math.hypot(ctm.a, ctm.b) || 1; // Skala: Bildschirm-Pixel pro SVG-Nutzereinheit

    const scale = targetRect.width / sourceRect.width; // dimensionsloses Verhältnis, unabhängig vom Koordinatensystem
    const dxScreen = (targetRect.left + targetRect.width / 2) - (sourceRect.left + sourceRect.width / 2);
    const dyScreen = (targetRect.top + targetRect.height / 2) - (sourceRect.top + sourceRect.height / 2);
    const dx = dxScreen / k;
    const dy = dyScreen / k;

    iconGroup.style.transition = 'transform 700ms cubic-bezier(0.4, 0, 0.2, 1)';
    iconGroup.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    splash.style.transition = 'opacity 300ms ease 500ms';
    splash.style.opacity = '0';

    iconGroup.addEventListener('transitionend', finishSplash, { once: true });
    // zusätzliches Sicherheitsnetz für diesen Schritt
    setTimeout(finishSplash, 1400);
  }

  function finishSplash() {
    clearTimeout(fallbackTimer);
    if (splash.dataset.done === '1') return;
    splash.dataset.done = '1';
    splash.style.display = 'none';
    if (logoSlot && !logoSlot.querySelector('img')) {
      const logoImg = document.createElement('img');
      logoImg.src = 'App Icon/icon-180.png';
      logoImg.alt = 'Logo';
      logoSlot.appendChild(logoImg);
    }
  }
})();

// Service Worker registrieren (für Offline-Nutzung)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
