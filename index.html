<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Training</title>

<!-- iOS Home-Bildschirm / PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23101418'/%3E%3Ccircle cx='100' cy='100' r='90' fill='%234fd1a5'/%3E%3Ctext x='100' y='122' font-family='Arial, sans-serif' font-size='58' font-weight='bold' fill='%2306231a' text-anchor='middle'%3EFIT%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101418">

<style>
  :root {
    color-scheme: dark;
    --bg: #101418;
    --card: #1b2128;
    --accent: #4fd1a5;
    --text: #f2f4f6;
    --muted: #9aa5b1;
    --done: #2a3a33;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px) 16px;
    max-width: 560px;
    margin: 0 auto;
  }
  header {
    padding: 20px 0 12px 0;
    text-align: center;
  }
  header h1 {
    font-size: 1.3rem;
    margin: 0 0 4px 0;
  }
  header .date {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .day-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 16px;
    border-radius: 999px;
    background: var(--accent);
    color: #06231a;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .progress {
    margin-top: 10px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  section {
    margin-top: 22px;
  }
  section h2 {
    font-size: 1rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 8px 4px;
  }
  ul.exercise-list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
  }
  li.exercise {
    display: flex;
    align-items: center;
    padding: 14px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    gap: 12px;
  }
  li.exercise:last-child { border-bottom: none; }
  li.exercise.done { background: var(--done); }
  .checkbox {
    flex: 0 0 26px;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: transparent;
  }
  li.exercise.done .checkbox {
    background: var(--accent);
    border-color: var(--accent);
    color: #06231a;
  }
  .exercise-info { flex: 1; min-width: 0; }
  .exercise-name {
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    color: var(--text);
  }
  li.exercise.done .exercise-name {
    color: var(--muted);
    text-decoration: line-through;
  }
  .exercise-name.has-link { color: var(--accent); }
  li.exercise.done .exercise-name.has-link { color: var(--muted); }
  .exercise-detail {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 2px;
  }
  footer {
    margin-top: 30px;
    text-align: center;
  }
  button.reset {
    background: none;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <h1>Mein Training</h1>
  <div class="date" id="today-date"></div>
  <div class="day-badge" id="day-badge"></div>
  <div class="progress" id="progress-text"></div>
</header>

<section>
  <h2>Warm-up (täglich)</h2>
  <ul class="exercise-list" id="warmup-list"></ul>
</section>

<section>
  <h2 id="day-section-title">Heutiges Training</h2>
  <ul class="exercise-list" id="day-list"></ul>
</section>

<footer>
  <button class="reset" id="reset-btn">Heutige Häkchen zurücksetzen</button>
</footer>

<script>
// ---------- Daten ----------
const warmup = [
  { id: 'w1', name: "Haltung des Kindes", detail: "1 Min", link: "https://www.fitkurs.de/uebungen/stellung-des-kindes/" },
  { id: 'w2', name: "Kobra", detail: "15 Sek" },
  { id: 'w3', name: "Katze-Kuh", detail: "10 Wdh.", link: "https://www.fitkurs.de/uebungen/katze-kuh/" },
  { id: 'w4', name: "Morning Stretch", detail: "30 Sek" },
  { id: 'w5', name: "Vorwärtsbeuge", detail: "15 Sek" },
  { id: 'w6', name: "World's Greatest Stretch", detail: "5 Wdh./Seite", link: "https://dieringe.com/de/exercises/worlds-greatest-stretch" },
];

const days = {
  A: {
    label: "Tag A – Push",
    exercises: [
      { id: 'a1', name: "Plank", detail: "2 Min", link: "https://www.fitkurs.de/uebungen/unterarmstuetz/" },
      { id: 'a2', name: "Seitliche Plank", detail: "45 Sek/Seite", link: "https://www.fitkurs.de/uebungen/seitlicher-unterarmstuetz-einsteiger/" },
      { id: 'a3', name: "Liegestütze", detail: "3 Sätze", link: "https://www.fitkurs.de/uebungen/liegestuetze/" },
      { id: 'a4', name: "Pallof Press", detail: "2 Sätze x 10-12/Seite", link: "https://www.fitbook.de/fitness/pallof-press-effektiver-als-plank" },
    ]
  },
  B: {
    label: "Tag B – Pull",
    exercises: [
      { id: 'b1', name: "Plank", detail: "2 Min", link: "https://www.fitkurs.de/uebungen/unterarmstuetz/" },
      { id: 'b2', name: "Klimmzüge", detail: "3 Sätze", link: "https://www.marathonfitness.de/klimmzuege-lernen/" },
      { id: 'b3', name: "Pallof Press", detail: "2 Sätze x 10-12/Seite", link: "https://www.fitbook.de/fitness/pallof-press-effektiver-als-plank" },
      { id: 'b4', name: "Superman Pulls", detail: "2-3 Sätze x 10-12", link: "https://www.fitkurs.de/uebungen/supermann/" },
    ]
  },
  C: {
    label: "Tag C – Beine",
    exercises: [
      { id: 'c1', name: "Plank", detail: "2 Min", link: "https://www.fitkurs.de/uebungen/unterarmstuetz/" },
      { id: 'c2', name: "Seitliche Plank", detail: "45 Sek/Seite", link: "https://www.fitkurs.de/uebungen/seitlicher-unterarmstuetz-einsteiger/" },
      { id: 'c3', name: "Kniebeugen", detail: "3 Sätze x 15-20", link: "https://dieringe.com/de/exercises/kniebeugen" },
      { id: 'c4', name: "Ausfallschritte", detail: "2-3 Sätze x 10/Bein", link: "https://dieringe.com/de/exercises/ausfallschritte" },
      { id: 'c5', name: "Glute Bridge", detail: "1 Min fix, dann 3 Sätze x 15-20", link: "https://www.fitkurs.de/uebungen/beckenheben/" },
      { id: 'c6', name: "Pallof Press im Ausfallschritt", detail: "2 Sätze x 10-12/Seite", link: "https://www.fitbook.de/fitness/pallof-press-effektiver-als-plank" },
    ]
  }
};

// Rotation-Anker: 28.07.2026 = Tag C
const ANCHOR_DATE = new Date(2026, 6, 28); // Monat 0-indexiert: 6 = Juli
const ROTATION_ORDER = ['A', 'B', 'C'];
const ANCHOR_INDEX = 2; // 'C'

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function startOfDay(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function getTodayLetter() {
  const today = startOfDay(new Date());
  const anchor = startOfDay(ANCHOR_DATE);
  const diffDays = Math.round((today - anchor) / 86400000);
  let idx = (ANCHOR_INDEX + diffDays) % 3;
  if (idx < 0) idx += 3;
  return ROTATION_ORDER[idx];
}

// ---------- Speicherung ----------
const STORAGE_KEY = 'fitness_progress';

function loadAllProgress() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function saveAllProgress(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getTodayProgress() {
  const all = loadAllProgress();
  const key = dateKey(new Date());
  return all[key] || {};
}

function setExerciseDone(exerciseId, done) {
  const all = loadAllProgress();
  const key = dateKey(new Date());
  if (!all[key]) all[key] = {};
  all[key][exerciseId] = done;
  saveAllProgress(all);
}

function resetToday() {
  const all = loadAllProgress();
  const key = dateKey(new Date());
  all[key] = {};
  saveAllProgress(all);
  render();
}

// ---------- Rendering ----------
function renderList(container, items, progress) {
  container.innerHTML = '';
  items.forEach(ex => {
    const li = document.createElement('li');
    li.className = 'exercise' + (progress[ex.id] ? ' done' : '');
    li.dataset.id = ex.id;

    const box = document.createElement('div');
    box.className = 'checkbox';
    box.textContent = '✓';

    const info = document.createElement('div');
    info.className = 'exercise-info';

    let nameEl;
    if (ex.link) {
      nameEl = document.createElement('a');
      nameEl.href = ex.link;
      nameEl.target = '_blank';
      nameEl.rel = 'noopener';
      nameEl.className = 'exercise-name has-link';
      nameEl.addEventListener('click', (e) => e.stopPropagation());
    } else {
      nameEl = document.createElement('span');
      nameEl.className = 'exercise-name';
    }
    nameEl.textContent = ex.name;

    const detail = document.createElement('span');
    detail.className = 'exercise-detail';
    detail.textContent = ex.detail;

    info.appendChild(nameEl);
    info.appendChild(detail);
    li.appendChild(box);
    li.appendChild(info);

    li.addEventListener('click', () => {
      const nowDone = !li.classList.contains('done');
      li.classList.toggle('done', nowDone);
      setExerciseDone(ex.id, nowDone);
      updateProgressText();
    });

    container.appendChild(li);
  });
}

function updateProgressText() {
  const progress = getTodayProgress();
  const letter = getTodayLetter();
  const allItems = [...warmup, ...days[letter].exercises];
  const doneCount = allItems.filter(ex => progress[ex.id]).length;
  document.getElementById('progress-text').textContent =
    `${doneCount} / ${allItems.length} erledigt`;
}

function render() {
  const today = new Date();
  const letter = getTodayLetter();
  const dayData = days[letter];
  const progress = getTodayProgress();

  document.getElementById('today-date').textContent =
    today.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  document.getElementById('day-badge').textContent = dayData.label;
  document.getElementById('day-section-title').textContent = dayData.label;

  renderList(document.getElementById('warmup-list'), warmup, progress);
  renderList(document.getElementById('day-list'), dayData.exercises, progress);
  updateProgressText();
}

document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('Heutige Häkchen wirklich zurücksetzen?')) {
    resetToday();
  }
});

render();

// Service Worker registrieren (für Offline-Nutzung)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
